name: asciidoc-linter

on:
  push:
#    branches: [ "main" ]
  pull_request:
#    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        allow-prereleases: true

    - name: Install asciidoc-linter
      run: |
        git clone --depth 1 https://github.com/docToolchain/asciidoc-linter.git
        python -m pip install --upgrade pip
        cd asciidoc-linter
        python pip install ./

    - name: Run The Linter
      run: |
        asciidoc-linter *.adoc


